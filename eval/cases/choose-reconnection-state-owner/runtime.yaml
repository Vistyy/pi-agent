schema_version: 1
case: choose-reconnection-state-owner
profile: scripted-pi-project
fixture:
  source: ./fixture
preflight:
  ownership-candidates-present:
    checker: files-contain
    files:
      - path: src/workspace-runtime.ts
        contains:
          - class WorkspaceRuntime
      - path: src/session-coordinator.ts
        contains:
          - class SessionCoordinator
  lifecycle-requirement-present:
    checker: files-contain
    files:
      - path: test/session-coordinator.test.ts
        contains:
          - reconnection state survives workspace replacement
          - assert.equal(coordinator.reconnect(), "resume-token")
  lifecycle-evidence-present:
    checker: files-contain
    files:
      - path: src/session-coordinator.ts
        contains:
          - replaceWorkspace
          - new WorkspaceRuntime
collectors:
  decision-conversation: pi-message-collector
  repository-inspection: pi-tool-trajectory-collector
graders:
  evidence-grounded-lifecycle-recommendation:
    implementation: evidence-gated-semantic-criterion
    evidence_gate:
      checker: successful-tool-results-contain
      observation: repository-inspection
      interaction_turn: 1
      artifacts:
        - id: workspace-runtime-lifecycle
          contains:
            - class WorkspaceRuntime
            - Workspace-scoped resources are released when the active workspace changes.
        - id: session-coordinator-lifecycle
          contains:
            - class SessionCoordinator
            - this.runtime.dispose()
            - this.runtime = new WorkspaceRuntime(workspace, this.reconnectionState)
        - id: reconnection-persistence-requirement
          contains:
            - reconnection state survives workspace replacement
            - assert.equal(coordinator.reconnect(), "resume-token")
